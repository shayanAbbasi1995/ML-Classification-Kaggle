[project]
name = "bgse-ml-classification"
version = "0.2.0"
description = "Probability-of-death (MIMIC-III) binary classification, rewritten 2026."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Shayan Abbasi" }]
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "mlflow==3.17.0",
    "pyarrow==25.0.1",
    "category-encoders==2.11.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pod"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines allowed up to 100; defer to formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
